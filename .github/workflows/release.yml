name: Release

on:
  release:
    types: [published]

jobs:
  build-artifacts:
    permissions:
      contents: write
    uses: ./.github/workflows/build-artifacts.yml

  build-android:
    permissions:
      contents: read
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  upload-release-assets:
    needs: [build-artifacts, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${{ github.ref_name }}
          cd artifacts

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uploading artifacts for release $TAG_NAME..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" -o -name "*.sha256" \) -print0 |
            while IFS= read -r -d '' asset; do
              echo "- Uploading: $asset" >> $GITHUB_STEP_SUMMARY
              gh release upload "$TAG_NAME" "$asset" --clobber
            done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  build-docker:
    needs: [build-artifacts]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      tags: ${{ github.ref_name }},latest
