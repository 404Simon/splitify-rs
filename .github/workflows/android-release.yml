name: android-release

# Builds the signed release APK. Called by release.yml when a GitHub release is
# published and runnable on its own (workflow_dispatch) to test the pipeline.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (default: splitify)
#   ANDROID_KEY_PASSWORD       key password
#
# The signing key must stay the same for every release: Android only installs an
# update whose signature matches the installed app.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag or version name (e.g. v1.2.3)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name override (defaults to the triggered ref, dev builds get a run-number version code)'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          raw="${INPUT_VERSION:-$REF_NAME}"
          raw="${raw#v}"
          if [[ "$raw" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name="$raw"
            code=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            name="${raw:-0.0.0}-dev"
            # Keep manual builds apart from tagged version codes without clashing.
            code=$((1000000 + GITHUB_RUN_NUMBER))
          fi
          # Branch names can contain slashes, which are illegal in file names.
          name="${name//\//-}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$name versionCode=$code"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release signing secrets first (see docs/RELEASE_PIPELINE.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/splitify-release.jks"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        working-directory: android
        env:
          SPLITIFY_KEYSTORE_PATH: ${{ runner.temp }}/splitify-release.jks
          SPLITIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPLITIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPLITIFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --no-daemon --stacktrace

      - name: Verify and package APK
        id: package
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No signed release APK was produced (missing signing configuration?)."
            exit 1
          fi

          APKSIGNER=$(find -L "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

          OUT="splitify-${VERSION_NAME}-android.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          echo "apk=$PWD/$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "### Android APK"
            echo ""
            echo "- Version: \`${VERSION_NAME}\` (code ${{ steps.version.outputs.code }})"
            echo "- File: \`${OUT}\`"
            echo "- Size: $(du -h "$OUT" | cut -f1)"
            echo "- SHA256: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- Signer:"
            echo '```'
            "$APKSIGNER" verify --print-certs "$OUT" | head -n 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: splitify-${{ steps.version.outputs.name }}-android
          path: |
            android/splitify-${{ steps.version.outputs.name }}-android.apk
            android/splitify-${{ steps.version.outputs.name }}-android.apk.sha256
          if-no-files-found: error
          retention-days: 14
